name: diagnose
# Builds an arm64 app (signed without notarization, and unsigned) and checks that it actually starts.
# Run manually: Actions -> diagnose -> Run workflow.
on:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        variant: [signed, unsigned]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Package (${{ matrix.variant }})
        run: |
          if [ "${{ matrix.variant }}" = unsigned ]; then
            pnpm exec electron-builder --mac dir --arm64 --publish never -c.mac.identity=null -c.mac.notarize=false
          else
            pnpm exec electron-builder --mac dir --arm64 --publish never -c.mac.notarize=false
          fi
      - name: Launch the real app for 20 seconds
        run: |
          APP="$PWD/release/mac-arm64/Fläx.app"
          rm -rf "$HOME/Library/Application Support/Fläx"
          ELECTRON_ENABLE_LOGGING=1 ELECTRON_ENABLE_STACK_DUMPING=1 "$APP/Contents/MacOS/Fläx" --enable-logging=stderr --v=0 > "$RUNNER_TEMP/app.out" 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then echo "STILL RUNNING after 20s (good)"; kill $PID; else echo "EXITED early"; fi
          wait $PID; echo "exit code $?"
          true
      - name: What the app said
        if: always()
        run: |
          echo "--- app output (last 80 lines)"; tail -80 "$RUNNER_TEMP/app.out" || true
          echo "--- user data"; ls -la "$HOME/Library/Application Support/Fläx" || true
          echo "--- flax.log"; cat "$HOME/Library/Application Support/Fläx/flax.log" 2>/dev/null | head -40 || true
          echo "--- crash reports"; ls -t "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -3 || true
