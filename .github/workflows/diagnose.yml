name: diagnose
# Builds an unsigned arm64 app and checks that it starts. Run manually: Actions -> diagnose -> Run workflow.
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm exec electron-builder --mac dir --arm64 --publish never -c.mac.identity=null -c.mac.notarize=false
      - run: tools/smoke.sh
