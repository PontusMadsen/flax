name: release
# Push a tag vX.Y.Z (see docs/RELEASING.md): this builds, signs, notarizes and attaches the Mac app to a GitHub Release (created if missing).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build and release, e.g. v1.0.0 (created on the chosen branch if it doesn't exist yet)
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: Package (signed + notarized when Apple secrets exist, otherwise unsigned)
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            pnpm exec electron-builder --mac --publish never
          else
            echo "::warning::No Apple secrets set; building UNSIGNED (updates will still verify checksums)."
            pnpm exec electron-builder --mac --publish never -c.mac.identity=null -c.mac.notarize=false
          fi
          ls -la release
      - name: Smoke test (the app must start before we publish it)
        run: tools/smoke.sh
      - name: Checksums
        run: cd release && shasum -a 256 Flax-*.zip Flax-*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to release (created as a draft, published only once every file is attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release that is public but still empty would make the updater see a "latest" release with no build in it.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Fläx ${TAG#v}" --generate-notes
          gh release upload "$TAG" release/Flax-*.zip release/Flax-*.dmg release/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
