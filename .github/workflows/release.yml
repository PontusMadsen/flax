name: release
# Publish a GitHub Release tagged vX.Y.Z (see docs/RELEASING.md) and this builds, signs, notarizes and attaches the Mac app.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: Package (signed + notarized when Apple secrets exist, otherwise unsigned)
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            pnpm exec electron-builder --mac --publish never
          else
            echo "::warning::No Apple secrets set; building UNSIGNED (updates will still verify checksums)."
            pnpm exec electron-builder --mac --publish never -c.mac.identity=null -c.mac.notarize=false
          fi
          ls -la release
      - name: Checksums
        run: cd release && shasum -a 256 Flax-*.zip Flax-*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/Flax-*.zip release/Flax-*.dmg release/SHA256SUMS.txt --clobber
